services:
  - type: web
    name: ledgerproof-orchestrator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py --host 0.0.0.0 --no-open
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GROQ_API_KEY
        sync: false
